[project]
name = "mattertune"
version = "0.1.0"
description = ""
authors = [{ name = "Nima Shoghi", email = "nimashoghi@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
# Core: the minimal set required to `import mattertune` and run inference with a
# backbone. Heavier/optional capabilities are split into extras below so the slim
# core stays light for open-source consumers. Install extras as needed, e.g.
#   pip install -e ".[train,data]"
dependencies = [
    "torch",
    "ase",
    "numpy",
    "nshconfig",
    "nshconfig-extra",
    "rich",
    # lightning + torchmetrics are import-required: FinetuneModuleBase subclasses
    # lightning.pytorch.LightningModule and the package __init__ pulls torchmetrics.
    "lightning",
    "torchmetrics",
]

[project.optional-dependencies]
# Extra training utilities (normalizers); the core trainer deps are in [dependencies].
train = ["scikit-learn"]
# Experiment logging backends
logging = ["wandb", "tensorboardX"]
# Materials data IO / structure handling
data = ["pymatgen", "nshconfig-extra[extra]", "nshutils"]
# Neighbor-list providers used by some backbones
neighborlist = ["vesin", "matscipy"]
# Development tooling
dev = ["pytest", "pre-commit", "ruff", "watchdog"]

[build-system]
requires = [
    "setuptools >= 61.0",
    "wheel",
    "Cython",
    "numpy"
]
build-backend = "setuptools.build_meta"

[tool.pyright]
typeCheckingMode = "standard"
deprecateTypingAliases = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportPrivateImportUsage = false
reportMatchNotExhaustive = "error"
reportImplicitOverride = "warning"
reportShadowedImports = "warning"

[tool.ruff.lint]
select = ["FA102", "FA100", "F401"]
ignore = ["F722", "F821", "E731", "E741"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mattertune*"]
